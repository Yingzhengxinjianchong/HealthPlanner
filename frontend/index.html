<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化健康规划师</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border-top-color: #14b8a6; /* Teal color */
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* 美化滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #a7a7a7; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }
        
        .card-hover {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .btn-gradient {
            background-image: linear-gradient(to right, #14b8a6, #0d9488);
        }
        .btn-gradient:hover {
            background-image: linear-gradient(to right, #0d9488, #14b8a6);
        }

        select:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .fade-in {
            animation: fadeInAnimation 0.5s ease-in-out;
        }
        @keyframes fadeInAnimation {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        /* 模态弹窗样式 */
        .modal-overlay {
            transition: opacity 0.3s ease;
        }
        .modal-container {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .modal-hidden {
            pointer-events: none;
        }
        .modal-hidden .modal-overlay {
            opacity: 0;
        }
        .modal-hidden .modal-container {
            opacity: 0;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-4xl min-h-screen">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-bold text-gray-800 tracking-tight">个性化智能健康顾问</h1>
            <p class="text-gray-500 mt-2">您的AI健康伙伴，每日定制专属方案</p>
        </header>

        <!-- 输入表单 -->
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg mb-8">
            <h2 class="text-2xl font-semibold text-gray-700 mb-6 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                </svg>
                请输入您的信息
            </h2>
            <form id="health-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="height" class="block text-sm font-medium text-gray-600 mb-1">身高 (cm)</label>
                    <input step="0.1" type="number" id="height" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="例如：175" required>
                </div>
                <div>
                    <label for="weight" class="block text-sm font-medium text-gray-600 mb-1">体重 (kg)</label>
                    <input step="0.1" type="number" id="weight" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="例如：70.5" required>
                </div>
                <div class="md:col-span-2">
                    <label for="age" class="block text-sm font-medium text-gray-600 mb-1">年龄</label>
                    <input type="number" id="age" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="例如：25" required>
                </div>

                <!-- 三级联动地区选择 -->
                <div class="md:col-span-2 grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                         <label for="province-select" class="block text-sm font-medium text-gray-600 mb-1">省份/直辖市</label>
                         <select id="province-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500" required>
                             <option value="">加载中...</option>
                         </select>
                    </div>
                     <div>
                         <label for="city-select" class="block text-sm font-medium text-gray-600 mb-1">城市</label>
                         <select id="city-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500" disabled>
                              <option value="">请先选省份</option>
                         </select>
                    </div>
                     <div>
                         <label for="district-select" class="block text-sm font-medium text-gray-600 mb-1">区/县</label>
                         <select id="district-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500" disabled>
                              <option value="">请先选城市</option>
                         </select>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label for="activity-level" class="block text-sm font-medium text-gray-600 mb-1">日常运动量</label>
                    <select id="activity-level" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="1">久坐族 / 无运动习惯</option>
                        <option value="2">轻度运动 / 每周1-3天</option>
                        <option value="3" selected>中度运动 / 每周3-5天</option>
                        <option value="4">激烈运动 / 每周6-7天</option>
                        <option value="5">超激烈运动 / 专业训练</option>
                    </select>
                </div>
                <div class="md:col-span-2 text-center mt-4">
                    <button type="submit" class="w-full md:w-1/2 btn-gradient text-white font-bold py-3 px-8 rounded-lg shadow-md transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500">
                        生成我的健康方案
                    </button>
                </div>
            </form>
        </div>

        <!-- 加载与错误提示 -->
        <div id="loader" class="text-center my-12 hidden">
            <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-20 w-20 mx-auto"></div>
            <p class="mt-4 text-gray-600 font-medium">AI教练正在为您定制方案，请稍候...</p>
        </div>
        <div id="error-container" class="my-8 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg shadow-sm hidden"></div>

        <!-- 结果展示 -->
        <div id="results-container" class="hidden space-y-8">
            <!-- 基础数据 -->
            <div id="base-info-container" class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg fade-in" style="animation-delay: 0.1s;"></div>
            <!-- AI教练建议 -->
            <div id="ai-coach-container" class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg fade-in" style="animation-delay: 0.2s;"></div>
            <!-- 健康小妙招 -->
            <div id="health-tip-container" class="p-4 bg-teal-50 border-l-4 border-teal-500 text-teal-800 rounded-lg shadow-sm hidden fade-in" style="animation-delay: 0.3s;"></div>
        </div>
    </div>

    <!-- 菜谱模态弹窗 -->
    <div id="recipe-modal" class="modal-hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <!-- 遮罩层 -->
        <div id="modal-overlay" class="modal-overlay absolute inset-0 bg-black bg-opacity-50"></div>
        <!-- 弹窗内容 -->
        <div id="modal-container" class="modal-container bg-white w-full max-w-4xl max-h-[80vh] rounded-2xl shadow-2xl z-10 flex flex-col">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800">为您找到的菜谱</h3>
                <button id="modal-close-btn" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto">
                <!-- 菜谱卡片将在这里动态生成 -->
            </div>
        </div>
    </div>


    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        // --- DOM元素 ---
        const healthForm = document.getElementById('health-form');
        const loader = document.getElementById('loader');
        const errorContainer = document.getElementById('error-container');
        const resultsContainer = document.getElementById('results-container');
        const baseInfoContainer = document.getElementById('base-info-container');
        const aiCoachContainer = document.getElementById('ai-coach-container');
        const healthTipContainer = document.getElementById('health-tip-container');
        const provinceSelect = document.getElementById('province-select');
        const citySelect = document.getElementById('city-select');
        const districtSelect = document.getElementById('district-select');
        
        // 模态弹窗元素
        const recipeModal = document.getElementById('recipe-modal');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');


        // --- 功能函数 ---

        function showLoading() {
            resultsContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            loader.classList.remove('hidden');
        }

        function hideLoading() {
            loader.classList.add('hidden');
        }

        function showError(message) {
            hideLoading();
            errorContainer.innerHTML = `<p class="font-bold">哎呀，出错了！</p><p>${message}</p>`;
            errorContainer.classList.remove('hidden');
        }

        function renderBaseInfo(baseInfo) {
            baseInfoContainer.innerHTML = `
                <h3 class="text-2xl font-semibold text-gray-700 mb-6 flex items-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>您的健康数据分析</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-gray-50 p-4 rounded-lg"><p class="text-sm text-gray-500">BMI指数</p><p class="text-2xl font-bold text-teal-600">${baseInfo.weightInfo.bmi}</p></div>
                    <div class="bg-gray-50 p-4 rounded-lg"><p class="text-sm text-gray-500">体重等级</p><p class="text-xl font-bold text-teal-600">${baseInfo.weightInfo.levelMessage}</p></div>
                    <div class="bg-gray-50 p-4 rounded-lg col-span-2"><p class="text-sm text-gray-500">每日建议热量</p><p class="text-xl font-bold text-teal-600">${baseInfo.calorieInfo.dailyCalorieRange}</p></div>
                </div>
                <div class="mt-4 p-3 bg-green-50 text-green-800 rounded-lg text-sm flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>今日天气: ${baseInfo.weatherInfo.weather}, ${baseInfo.weatherInfo.temperature}°C</div>`;
        }
        
        function renderAiCoach(aiCoach) {
            let foodHtml = aiCoach.food_recommendations.map(food => `<div class="bg-white p-4 rounded-lg border border-gray-200 cursor-pointer card-hover food-item" data-keyword="${food.search_keyword}"><h4 class="font-semibold text-gray-800">${food.name}</h4><p class="text-gray-600 text-sm mt-1">${food.reason}</p><p class="text-xs text-teal-500 font-semibold mt-2">查看类似菜谱 »</p></div>`).join('');
            let exerciseHtml = aiCoach.exercise_recommendations.map(ex => `<div class="bg-white p-4 rounded-lg border border-gray-200"><h4 class="font-semibold text-gray-800">${ex.name}</h4><p class="text-gray-600 text-sm mt-1">${ex.reason}</p></div>`).join('');
            aiCoachContainer.innerHTML = `
                <h3 class="text-2xl font-semibold text-gray-700 mb-6 flex items-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>AI 教练为您定制</h3>
                <div class="p-4 bg-amber-50 text-amber-800 rounded-lg mb-6 border-l-4 border-amber-400"><p class="font-bold">今日总结与鼓励：</p><p class="mt-1 text-sm">${aiCoach.summary}</p></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gray-50 p-4 rounded-xl"><h4 class="text-lg font-semibold text-gray-700 mb-3 flex items-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path d="M19.428 10.572a.5.5 0 00-.856-.354l-7.25 7.25a.5.5 0 00.708.708l7.25-7.25a.5.5 0 00-.352-.854z" /><path d="M12.536 3.464a.5.5 0 00-.708 0L2.572 12.72a.5.5 0 00.708.708l9.256-9.256a.5.5 0 000-.708z" /><path d="M11.5 13a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" /><path d="M8.5 7a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" /><path d="M5.5 10a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" /></svg>饮食建议</h4><div class="space-y-4">${foodHtml}</div></div>
                    <div class="bg-gray-50 p-4 rounded-xl"><h4 class="text-lg font-semibold text-gray-700 mb-3 flex items-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.293 9.707a1 1 0 010-1.414l6-6a1 1 0 011.414 0l6 6a1 1 0 01-1.414 1.414L11 5.414V17a1 1 0 11-2 0V5.414L4.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>运动建议</h4><div class="space-y-4">${exerciseHtml}</div></div>
                </div>`;
        }
        
        // 获取并渲染菜谱到模态弹窗中
        async function fetchAndRenderRecipes(keyword) {
            modalTitle.textContent = `为您找到关于“${keyword}”的菜谱`;
            modalContent.innerHTML = '<p class="text-gray-500 text-center">正在查找菜谱...</p>';
            openModal();

            try {
                const response = await fetch(`${API_BASE_URL}/recipe?word=${encodeURIComponent(keyword)}`);
                if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.details || '获取菜谱失败'); }
                const recipes = await response.json();
                if (!recipes || recipes.length === 0) { modalContent.innerHTML = '<p class="text-center text-gray-500 w-full">哎呀，暂时没有找到相关的菜谱。</p>'; return; }
                
                modalContent.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${recipes.map(recipe => `
                    <div class="bg-gray-50 border border-gray-200 p-4 rounded-lg">
                        <h5 class="font-bold text-md truncate">${recipe.cp_name}</h5>
                        <p class="text-xs text-gray-500 mb-2">分类: ${recipe.type_name}</p>
                        <p class="text-sm font-semibold mt-2">原料:</p>
                        <p class="text-xs text-gray-600">${recipe.yuanliao}</p>
                        <p class="text-sm font-semibold mt-2">做法:</p>
                        <p class="text-xs text-gray-600 h-24 overflow-y-auto">${recipe.zuofa}</p>
                    </div>`).join('')}</div>`;
            } catch(error) {
                modalContent.innerHTML = `<p class="text-red-500 w-full text-center">获取菜谱失败: ${error.message}</p>`;
            }
        }
        
        // 获取健康小妙招
        async function fetchAndRenderHealthTip() {
            try {
                 const response = await fetch(`${API_BASE_URL}/healthtip`);
                 if (!response.ok) return;
                 const tip = await response.json();
                 healthTipContainer.innerHTML = `<div class="flex items-start"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-teal-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg><div><p class="font-bold">今日健康主题：${tip.keyword}</p><p class="text-sm mt-1">${tip.content}</p></div></div>`;
                 healthTipContainer.classList.remove('hidden');
            } catch (error) {
                console.error("获取健康小妙招失败:", error);
                healthTipContainer.classList.add('hidden');
            }
        }
        
        // 模态弹窗控制函数
        function openModal() {
            recipeModal.classList.remove('modal-hidden');
        }
        function closeModal() {
            recipeModal.classList.add('modal-hidden');
        }


        // --- 联动下拉框逻辑 ---
        
        function populateSelect(selectElement, options, placeholder) {
            selectElement.innerHTML = `<option value="">${placeholder}</option>`;
            if(options && options.length > 0){
                options.forEach(option => {
                    const opt = document.createElement('option');
                    opt.value = option.value;
                    opt.textContent = option.label;
                    selectElement.appendChild(opt);
                });
                selectElement.disabled = false;
            } else {
                selectElement.disabled = true;
            }
        }

        async function fetchRegions(parentId = '') {
            try {
                const url = parentId ? `${API_BASE_URL}/regions?parent=${parentId}` : `${API_BASE_URL}/regions`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('无法加载地区数据');
                return await response.json();
            } catch (error) {
                console.error('获取地区数据失败:', error);
                showError('无法从后端加载地区列表，请检查后端服务是否正常。');
                return [];
            }
        }
        
        // --- 事件监听 ---

        healthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading();

            let finalAdcode = '', finalCityName = '';
            if (districtSelect.value) {
                finalAdcode = districtSelect.value;
                finalCityName = districtSelect.options[districtSelect.selectedIndex].text;
            } else if (citySelect.value) {
                finalAdcode = citySelect.value;
                finalCityName = citySelect.options[citySelect.selectedIndex].text;
            } else if (provinceSelect.value) {
                finalAdcode = provinceSelect.value;
                finalCityName = provinceSelect.options[provinceSelect.selectedIndex].text;
            }

            const userData = {
                height: parseFloat(document.getElementById('height').value),
                weight: parseFloat(document.getElementById('weight').value),
                age: parseInt(document.getElementById('age').value),
                adcode: finalAdcode, 
                city: finalCityName, 
                activityLevel: parseInt(document.getElementById('activity-level').value)
            };

            if (!userData.height || !userData.weight || !userData.age || !userData.adcode) { showError('所有信息（包括完整的地区选择）都必须填写哦！'); return; }

            try {
                const response = await fetch(`${API_BASE_URL}/getHealthPlan`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(userData) });
                if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.details || '服务器返回错误'); }
                const data = await response.json();
                
                hideLoading();
                healthTipContainer.classList.add('hidden'); // 先隐藏旧的
                fetchAndRenderHealthTip(); // 成功后再获取新的妙招
                renderBaseInfo(data.baseInfo);
                renderAiCoach(data.aiCoach);
                resultsContainer.classList.remove('hidden');
                
                // 自动平滑滚动到结果区域
                resultsContainer.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                showError(`请求失败: ${error.message}。请确保后端服务器正在运行，并解决了跨域(CORS)问题。`);
            }
        });

        aiCoachContainer.addEventListener('click', (e) => {
            const foodItem = e.target.closest('.food-item');
            if (foodItem) {
                const keyword = foodItem.dataset.keyword;
                if(keyword) { fetchAndRenderRecipes(keyword); } // 点击后触发弹窗
            }
        });
        
        // 模态弹窗关闭事件
        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', closeModal);

        // 补全联动下拉框的事件监听
        provinceSelect.addEventListener('change', async () => {
            const provinceCode = provinceSelect.value;
            // 重置并禁用下游选择框
            populateSelect(citySelect, [], '请先选省份');
            citySelect.disabled = true;
            populateSelect(districtSelect, [], '请先选城市');
            districtSelect.disabled = true;

            if (provinceCode) {
                // 如果选择了有效的省份，则获取并填充城市列表
                const cities = await fetchRegions(provinceCode);
                populateSelect(citySelect, cities, '请选择城市');
            }
        });

        citySelect.addEventListener('change', async () => {
            const cityCode = citySelect.value;
             // 重置并禁用区县选择框
            populateSelect(districtSelect, [], '请先选城市');
            districtSelect.disabled = true;

            if (cityCode) {
                // 如果选择了有效的城市，则获取并填充区县列表
                const districts = await fetchRegions(cityCode);
                if (districts && districts.length > 0) {
                    populateSelect(districtSelect, districts, '请选择区/县');
                } else {
                    // 对于没有区县的城市（如东莞），保持禁用状态
                    populateSelect(districtSelect, [], '无可选区/县');
                    districtSelect.disabled = true;
                }
            }
        });

        // 页面加载完成后，初始化省份列表
        document.addEventListener('DOMContentLoaded', async () => {
            const provinces = await fetchRegions();
            populateSelect(provinceSelect, provinces, '请选择省份');
        });

    </script>
</body>
</html>
